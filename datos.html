<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=7, initial-scale=1.0">
    <title>Datos</title>
</head>
<body>
    <h2>Datos Basicos</h2>
    <script>
        let nombre=prompt(`Escribe tu nombre`);
        let edad=Number(prompt(`Escribe tu edad`));
        let esp=prompt(`Escribe tu especialidad:`);
        let dire=prompt(`Escribe tu dirección`);

        document.write(
            "Nombre: "+nombre+"<br>"+
            "Edad: "+edad+"<br>"+
            "Especialidad: "+esp+"<br>"+
            "Dirección: "+dire
        );
    </script>
</body>
</html>
