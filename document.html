<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>document.getElementById</title>
</head>
<body>
    <h2>Mostrar Mensaje</h2>
    <p id="aviso">Mensaje</p>
    <script>
        var elemento=document.getElementById("aviso");
        elemento.textContent="Hola Estudiante";
    </script>
    <br>
    <h2>Cambiar el color</h2>
    <button id="btn">Haz Clic</button>
    <script>
        document.getElementById("btn").style.backgroundColor="lightblue"
    </script>
      <br><br>
<a href="index.html" style="display: inline-block; background-color: #f8c8dc; color: #924a71; text-decoration: none; padding: 10px 20px; border-radius: 12px; font-family: 'Trebuchet MS';">← Volver al inicio</a>
</body>
</html>
