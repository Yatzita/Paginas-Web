<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operaciones</title>
</head>
<body>
    <h2>Operaciones Basicas</h2>
    <script>
        let N1=Number(prompt(`Introduce el primer numero`));
        let N2=Number(prompt(`Introduce el segundo numero`));
        suma=N1+N2;
        document.write("El valor de suma: "+suma+"<br>");
        resta=N1-N2;
        document.write("El valor de la resta: "+resta+"<br>");
        multiplicacion=N1*N2;
        document.write("El valor de la multiplicación: "+multiplicacion+"<br>");
        division=N2/N1;
        document.write("El valor de la división: "+division);
    </script>
</body>
</html>
