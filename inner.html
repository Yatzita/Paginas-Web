<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>inner.HTML</title>
</head>
<body>
    <h2>Cambiar Texto</h2>
    <p id="mensaje">Hola Mundo</p>
    <script>
        document.getElementById("mensaje").innerHTML="¡Bienvenido!";
    </script>
    <br>
    <h2>Agregar Imagen</h2>
    <div id="imagen"></div>
    <script>
        document.getElementById("imagen").innerHTML='<img src="Mizi.jpeg" alt="Mizi">';
    </script>
    <br>
    <br>
    <a href="index.html" style="color: purple; text-decoration: none;">← Volver al inicio</a>
</body>
</html>
