                }
                break;

                }

                if (dia <= 20) {

                }

                if (dia <= 22) {

                    signo = "Capricornio";
                }
                break;

            default:
                signo = "Mes no válido";
        }

        document.write("Nombre: " + nombre + "<br>");
        document.write("Tu signo zodiacal es: " + signo);
