<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>querySelector</title>
</head>
<body>
    <h2>Obtener un elemento</h2>
    <p class="destacado">Texto importante</p>
    <script>
        document.querySelector(".destacado").style.color="red";
    </script>
    <br>
    <h2>Obtener un boton y desabilitado</h2>
    <button class="btn">Enviar</button>
    <script>
        document.querySelector(".btn").disable=true;
    </script>

</html>
